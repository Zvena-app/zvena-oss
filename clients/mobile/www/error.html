<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'unsafe-inline'; script-src 'self'">
<meta name="color-scheme" content="light dark">
<title>zvena</title>
<style>
  :root { --bg: #ffffff; --text: #1e1e1e; --text-2: #6e6e6e; --brand: #0d99ff; --brand-hover: #007be5; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1e1e1e; --text: #ffffff; --text-2: #b3b3b3; } .logo { filter: invert(1); } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
  body { font: 15px/1.45 "Zvena Sans", "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; align-items: center; justify-content: center; padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom); box-sizing: border-box; }
  main { max-width: 340px; text-align: center; }
  .logo { width: 132px; height: auto; margin-bottom: 28px; }
  h1 { font-size: 17px; font-weight: 600; margin: 0 0 6px; }
  p { margin: 0 0 22px; color: var(--text-2); }
  button { font: inherit; font-weight: 500; height: 40px; padding: 0 20px; border: 0; border-radius: 8px; background: var(--brand); color: #fff; }
  button:active { background: var(--brand-hover); }
</style>
</head>
<body>
<main>
  <img class="logo" src="logo.svg" alt="zvena">
  <h1 id="title">Can't reach zvena</h1>
  <p id="body">Check your internet connection and try again.</p>
  <button id="retry" type="button">Try again</button>
</main>
<script src="app-url.js"></script>
<script src="error.js"></script>
</body>
</html>
