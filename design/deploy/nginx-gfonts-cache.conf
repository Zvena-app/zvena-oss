# zvena: Google Fonts are served by Design itself. The server fetches a font
# or its CSS from Google once and keeps it on the fonts-cache volume for years
# (fonts never change under a versioned URL), so the browser only ever talks
# to Design and a later outage on Google's side does not break cached fonts.
proxy_cache_path /opt/data/gfonts levels=2:2 keys_zone=zvfonts:20m max_size=8g inactive=3650d use_temp_path=off;
