# zvena: the web app manifest (Help → Get desktop app). It lives under
# images/ with the app icons, but the generic rule that sends unknown files
# in sub-directories to /404 would catch a .json there.
location = /images/manifest.json {
    include /etc/nginx/nginx-security-headers.conf;
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
}
