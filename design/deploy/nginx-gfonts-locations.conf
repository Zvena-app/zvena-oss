# zvena: replaces Penpot's external-locations.conf. Only the Google Fonts
# proxy is kept (the GitHub templates proxy is not used: the templates section
# is off). Cached on the fonts-cache volume, see nginx-gfonts-cache.conf.
location ~ ^/internal/gfonts/font/(?<font_file>.+) {
    proxy_pass https://fonts.gstatic.com/s/$font_file;
    proxy_ssl_server_name on;

    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Cross-Origin-Resource-Policy;
    proxy_hide_header Link;
    proxy_hide_header Alt-Svc;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Report-To;
    proxy_hide_header Set-Cookie;
    proxy_ignore_headers Set-Cookie Vary Cache-Control Expires;

    proxy_set_header User-Agent "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/113.0.0.0 Safari/537.36";
    proxy_set_header Host "fonts.gstatic.com";
    proxy_set_header Accept "*/*";
    proxy_set_header Cookie "";
    proxy_set_header Referer "";
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-For "";

    proxy_cache zvfonts;
    proxy_cache_key "gfont:$font_file";
    proxy_cache_valid 200 3650d;
    proxy_cache_valid 404 10m;
    proxy_cache_valid any 1m;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

    add_header Access-Control-Allow-Origin $http_origin;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Cache-Status $upstream_cache_status;
}

location ~ ^/internal/gfonts/css {
    proxy_pass https://fonts.googleapis.com/css?$args;
    proxy_ssl_server_name on;

    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Cross-Origin-Resource-Policy;
    proxy_hide_header Link;
    proxy_hide_header Alt-Svc;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    proxy_hide_header Set-Cookie;
    proxy_ignore_headers Set-Cookie Vary Cache-Control Expires;

    proxy_set_header User-Agent "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/113.0.0.0 Safari/537.36";
    proxy_set_header Host "fonts.googleapis.com";
    proxy_set_header Accept "*/*";
    proxy_set_header Cookie "";
    proxy_set_header Referer "";
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-For "";

    proxy_cache zvfonts;
    proxy_cache_key "gcss:$args";
    proxy_cache_valid 200 3650d;
    proxy_cache_valid any 1m;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

    add_header Access-Control-Allow-Origin $http_origin;
    add_header Cache-Control "public, max-age=604800";
    add_header X-Cache-Status $upstream_cache_status;
}
