<!-- zvena design template "Mobile app": five 390×844 screens.
     Each <template data-board> becomes one board; see ../README.md. -->

<template data-board="01 Sign in">
<div style="width:390px;height:844px;background:#FFFFFF;color:#141413;display:flex;flex-direction:column;justify-content:space-between;padding:72px 24px 40px">
  <div style="display:flex;flex-direction:column;gap:32px">
    <div style="width:56px;height:56px;border-radius:16px;background:#2C84DB"></div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <h1 style="font-size:32px;font-weight:700">Welcome back</h1>
      <p style="font-size:17px;color:#55534D">Sign in to continue.</p>
    </div>
    <div style="display:flex;flex-direction:column;gap:16px">
      <div style="display:flex;flex-direction:column;gap:6px">
        <span style="font-size:14px;font-weight:600;color:#55534D">Email</span>
        <div style="padding:14px 16px;border-radius:12px;border:1px solid #DAD7CE;font-size:17px;color:#8A877E">you@example.com</div>
      </div>
      <button style="padding:16px;border-radius:12px;background:#2C84DB;color:#FFFFFF;font-size:17px;font-weight:600;text-align:center">Continue</button>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <div style="width:140px;height:1px;background:#ECEAE3"></div>
      <span style="font-size:14px;color:#8A877E">or</span>
      <div style="width:140px;height:1px;background:#ECEAE3"></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <button style="padding:15px;border-radius:12px;border:1px solid #DAD7CE;font-size:17px;font-weight:600;text-align:center">Continue with Google</button>
      <button style="padding:15px;border-radius:12px;border:1px solid #DAD7CE;font-size:17px;font-weight:600;text-align:center">Continue with Apple</button>
    </div>
  </div>
  <p style="font-size:13px;line-height:1.5;color:#8A877E;text-align:center">By continuing you accept the Terms and the Privacy policy.</p>
</div>
</template>

<template data-board="02 Feed">

    </div>
    <div style="display:flex;gap:8px;padding:0 20px 16px">
      <span style="padding:8px 14px;border-radius:999px;background:#141413;color:#FFFFFF;font-size:14px;font-weight:600">All</span>

      <div style="display:flex;flex-direction:column;gap:12px;padding:12px;border-radius:16px;background:#FFFFFF">
        <div style="height:180px;border-radius:12px;background:linear-gradient(135deg,#DCEBFA,#F4F1E8)"></div>
        <div style="display:flex;flex-direction:column;gap:4px;padding:0 4px 4px">

        <div style="display:flex;flex-direction:column;gap:4px">

    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;color:#8A877E"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8A877E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg><span>Notifications</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;color:#8A877E"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8A877E" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Profile</span></div>

<template data-board="03 Event">
<div style="width:390px;height:844px;background:#FFFFFF;color:#141413;display:flex;flex-direction:column;justify-content:space-between">
  <div style="display:flex;flex-direction:column">
    <div style="height:320px;background:linear-gradient(160deg,#BFDAF5,#F4F1E8);display:flex;flex-direction:column;padding:56px 20px">
      <div style="width:40px;height:40px;border-radius:20px;background:#FFFFFF;display:flex;align-items:center;justify-content:center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#141413" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:16px;padding:24px 20px">
      <span style="align-self:flex-start;padding:6px 10px;border-radius:8px;background:#EAF3FC;color:#2470BD;font-size:13px;font-weight:600">Today, 6:00 PM</span>
      <h1 style="font-size:28px;font-weight:700">Riverside walk</h1>
      <p style="font-size:16px;line-height:1.55;color:#55534D">An easy route along the river: start at the bridge, finish at the coffee shop. Bring comfy shoes and a good mood.</p>
      <div style="display:flex;align-items:center;gap:12px">
        <div style="width:40px;height:40px;border-radius:20px;background:#F4E3C8"></div>
        <div style="display:flex;flex-direction:column"><span style="font-size:15px;font-weight:600">Anna Collins</span><span style="font-size:13px;color:#8A877E">Organizer</span></div>
      </div>
    </div>
  </div>
  <div style="display:flex;gap:12px;padding:16px 20px 36px;border-top:1px solid #ECEAE3">
    <button style="width:56px;padding:15px 0;border-radius:12px;border:1px solid #DAD7CE;text-align:center;font-size:17px">♡</button>
    <button style="width:282px;padding:16px;border-radius:12px;background:#2C84DB;color:#FFFFFF;font-size:17px;font-weight:600;text-align:center">I’m going</button>
  </div>
</div>
</template>

</div>

<template data-board="05 Settings">
