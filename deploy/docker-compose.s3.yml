# Design's files in S3-compatible storage (AWS S3, Cloudflare R2, Backblaze
# B2, Wasabi…) instead of the assets volume. Add with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.s3.yml …
services:
  design-backend:
    environment:
      PENPOT_OBJECTS_STORAGE_BACKEND: s3
      PENPOT_OBJECTS_STORAGE_S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
      PENPOT_OBJECTS_STORAGE_S3_REGION: ${S3_REGION:?set S3_REGION}
      PENPOT_OBJECTS_STORAGE_S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
