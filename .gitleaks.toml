# Secret scanning (gitleaks): the default rules plus our own.

[extend]
useDefault = true

[[rules]]
id = "resend-api-key"
description = "Resend API key"
regex = '''\bre_[A-Za-z0-9]{8,}_[A-Za-z0-9]{16,}\b'''
keywords = ["re_"]

[[allowlists]]
description = "Message ids (modals.some-dialog.hint1) in translation files are not keys"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)i18n/[^/]+\.json$''']
regexTarget = "secret"
regexes = ['''^[a-z][a-z0-9-]*(\.[a-z0-9-]+)+$''']
